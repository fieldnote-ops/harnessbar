name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq qt6-declarative-dev-tools
          if [ -x /usr/lib/qt6/bin/qmllint ]; then
            sudo ln -sf /usr/lib/qt6/bin/qmllint /usr/local/bin/qmllint
          fi
          qmllint --version

      - name: Validate manifest and repository layout
        run: bash tools/validate.sh

      - name: Shell syntax
        run: bash -n bin/harnessbar

      - name: Tests
        env:
          HARNESSBAR_REQUIRE_QML: "1"
        run: bash tests/run_tests.sh
